# Base configuration, bound to @ConfigurationProperties("app").
# Profile files override it: config/application-<profile>.toml, selected by FLINT_PROFILE.
[app]
greeting = "Hello"

# flint:starter-web (ADR-028). Every key is optional.
[server]
address = "127.0.0.1"
port = 8080

# Serve the front end in resources/static, with index.html for client-side routes.
[spa]
directory = "resources/static"
