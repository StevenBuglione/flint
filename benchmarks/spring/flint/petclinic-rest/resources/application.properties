# Modified by the Flint authors: spring.* keys are flint.* (R1); the JPA keys are dropped, since the port runs the
# jdbc profile; the default profiles are postgres,jdbc, the ones benchmarks/spring/apps.json runs (H2 is a Java
# embedded database).
flint.profiles.active=postgres,jdbc
server.port=9966
server.servlet.context-path=/petclinic/
flint.sql.init.platform=postgres
flint.sql.init.mode=always
flint.sql.init.schema-locations=classpath*:db/${flint.sql.init.platform}/schema.sql
flint.sql.init.data-locations=classpath*:db/${flint.sql.init.platform}/data.sql
flint.messages.basename=messages/messages
logging.level.org.springframework=INFO
petclinic.security.enable=false
