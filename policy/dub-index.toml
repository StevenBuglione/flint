# The DUB compatibility index (ADR-021 sections 4 and 5, ADR-023).
#
# Curated DUB package versions that Flint projects may use as "dub:<name>" = "<version>". Each entry pins:
#   repository    the repository path, fetched like a repository-path dependency (FLINT_PROXY applies)
#   commit        the release tag's commit; a moved tag is refused
#   tree_sha256   flint's content hash of the checkout at that commit
#   license       the SPDX licence expression, checked by flint deps audit and written to SBOMs
#   dependencies  the exact index versions of the DUB packages it needs, as name@version
#   native        the Flint native recipes that replace its libs/systemDependencies, as name@version
# flint runs its D safety rules over every package; one that fails them builds only under an
# [unchecked] waiver in the project's flint.toml, shown in every build, its receipt, the SBOM and the audit.

