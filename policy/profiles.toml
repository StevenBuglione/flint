# Canonical build profiles (ADR-018, ADR-021 section 8, ADR-022).
#
# This file is the single source of build flags. `flint` reads it through
# flint.config, and tools/ci.py and tools/measure_builds.py read it through
# tools/profiles.py, so the developer loop, CI and measurement cannot drift.
# A project may add flags on top of a profile in its flint.toml or on the
# command line; the build receipt then marks the artifact non-canonical and
# lists the additions.
#
# Keys:
#   compiler        executable name of the pinned compiler (dmd or ldc2)
#   compilers       compilers a test run covers with --compiler both
#   build_type      DUB build type; "plain" means the dflags below are the
#                   complete compiler flag set (passed through DFLAGS)
#   dflags          compiler flags, in order
#   lflags          linker flags, in order
#   glibc_lflags    linker flags added after lflags when the output is a Linux
#                   glibc position-independent executable: the host's native
#                   build on linux-*-glibc, never a musl static, macOS or
#                   Windows output. -z pack-relative-relocs stores the PIE's
#                   relative relocations as RELR (glibc 2.36+, GNU ld 2.38+,
#                   mold, lld), with PIE, relro and now unchanged.
#   compile_server  allow the forked DMD's resident compile server
#   dub_pipeline    allow the forked DUB's parallel build pipeline
#   native_profile  tools/native_build.py provider profile the build links
#   native_sanitize sanitizers the native providers are built with, if any
#
# -fno-moduleinfo-localclasses (LDC upstream; the Flint DMD fork has the same
# switch) leaves ModuleInfo.localClasses empty, so --gc-sections drops every
# class no code instantiates or names. Object.factory and TypeInfo_Class.find
# then cannot find those classes; Flint never constructs from a string name.

[profile.dev]
description = "Development loop: forked DMD with the compile server and the parallel DUB pipeline."
compiler = "dmd"
compilers = ["dmd"]
build_type = "plain"
dflags = ["-preview=dip1000", "-debug", "-g", "-boundscheck=on"]
lflags = []
glibc_lflags = ["-z", "pack-relative-relocs"]
compile_server = true
dub_pipeline = true
native_profile = "ci"
native_sanitize = ""

[profile.test]
description = "Unittest builds on both compilers with each package's own recipe flags."
compiler = "dmd"
compilers = ["dmd", "ldc2"]
build_type = "unittest"
dflags = []
lflags = []
glibc_lflags = ["-z", "pack-relative-relocs"]
compile_server = true
dub_pipeline = true
native_profile = "ci"
native_sanitize = ""

[profile.release]
description = "Release: LDC -O3 with ThinLTO and static default libraries."
compiler = "ldc2"
compilers = ["ldc2"]
build_type = "plain"
dflags = ["-preview=dip1000", "-release", "-boundscheck=safeonly", "-O3", "--flto=thin", "-link-defaultlib-shared=false", "-fno-moduleinfo-localclasses"]
lflags = []
glibc_lflags = ["-z", "pack-relative-relocs"]
compile_server = false
dub_pipeline = true
native_profile = "ci"
native_sanitize = ""

[profile.size]
description = "Size: as release, optimised with -Oz."
compiler = "ldc2"
compilers = ["ldc2"]
build_type = "plain"
dflags = ["-preview=dip1000", "-release", "-boundscheck=safeonly", "-Oz", "--flto=thin", "-link-defaultlib-shared=false", "-fno-moduleinfo-localclasses"]
lflags = []
glibc_lflags = ["-z", "pack-relative-relocs"]
compile_server = false
dub_pipeline = true
native_profile = "ci"
native_sanitize = ""

[profile.sanitize]
description = "Sanitizer lane: LDC unittests with ASan and UBSan on the sanitizer-aware runtime."
compiler = "ldc2"
compilers = ["ldc2"]
build_type = "plain"
dflags = ["-g", "-O1", "-unittest", "-preview=dip1000", "-boundscheck=on", "-fsanitize=address", "-defaultlib=phobos2-ldc-sanitizers,druntime-ldc-sanitizers", "-gcc=clang", "-Xcc=-fsanitize=address,undefined"]
lflags = []
# The sanitizer lane keeps the default relocation format: its binaries are never shipped.
glibc_lflags = []
compile_server = false
dub_pipeline = true
native_profile = "ci"
native_sanitize = "address,undefined"
